<!-- apps/web/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reflex — Retailer Login</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>

  <div class="login-screen">
    <div class="login-card">
      <div class="wordmark">Reflex<span>.</span></div>
      <div class="login-sub">Retailer sign in</div>

      <form id="login-form">
        <label for="email">Email</label>
        <input type="email" id="email" value="kay@reflex.test" required>

        <label for="password">Password</label>
        <input type="password" id="password" value="demo" required>

        <div class="form-error" id="login-error"></div>

        <button type="submit" class="btn-primary">Sign in</button>
      </form>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script src="assets/login.js"></script>
</body>
</html>
